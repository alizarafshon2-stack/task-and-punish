name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Project with SDK 36
        run: |
          rm -rf android
          flutter create . --org com.taskandpunish --project-name task_and_punish --platforms=android
          
          # Прописываем верную версию API 36 для geolocator
          echo "flutter.minSdkVersion=21" >> android/local.properties
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          
          # Принудительно ставим compileSdk 36 во всех конфигурациях
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = .*/minSdk = 21/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion .*/minSdkVersion 21/g' {} +

          flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-and-punish-app
          path: build/app/outputs/flutter-apk/app-debug.apk
