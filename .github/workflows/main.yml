name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Clean Android Project
        run: |
          rm -rf android
          flutter create . --org com.taskandpunish --project-name task_and_punish --platforms=android
          flutter pub get

      - name: Build APK with Error Capture
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace || {
            echo "=========================================="
            echo "ГЛАВНАЯ ПРИЧИНА ОШИБКИ:"
            ./gradlew assembleDebug --quiet 2>&1 | tail -n 25
            echo "=========================================="
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-and-punish-app
          path: build/app/outputs/flutter-apk/app-debug.apk
