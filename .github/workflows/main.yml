name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Generate Android Skeleton
        run: |
          flutter create . --org com.taskandpunish --project-name task_and_punish --platforms=android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Force Min SDK 21 for Camera Plugin
        run: |
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { android { defaultConfig { minSdkVersion 21 } } } } }" >> android/build.gradle

      - name: Install dependencies
        run: flutter pub get

      - name: Compile Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: task-and-punish-app
          path: build/app/outputs/flutter-apk/app-debug.apk
