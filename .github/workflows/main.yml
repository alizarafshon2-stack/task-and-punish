name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Clean Android Project
        run: |
          rm -rf android
          flutter create . --org com.taskandpunish --project-name task_and_punish --platforms=android
          
          # Принудительно задаем minSdk = 21 в новом формате Kotlin DSL (.kts)
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 21/g' android/app/build.gradle.kts
            sed -i 's/minSdkVersion.*/minSdkVersion = 21/g' android/app/build.gradle.kts
          fi
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion.*/minSdkVersion 21/g' android/app/build.gradle
          fi

          flutter pub get

      - name: Build Debug APK
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: task-and-punish-app
          path: build/app/outputs/flutter-apk/app-debug.apk
